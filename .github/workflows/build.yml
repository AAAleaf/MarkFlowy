name: Build Windows EXE

# 触发条件：
#   1. 手动触发（Actions 页面 -> 左侧 Build Windows EXE -> Run workflow）
#   2. 推送形如 v* 的 tag（例如 git tag v1.0.0 && git push origin v1.0.0）时自动构建并发布 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 用于读取代码、创建 Release

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 前端环境：Node 22（package.json engines 要求 >=22.12）----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---- 启用 Corepack 以使用 package.json 中声明的 Yarn 4.8 ----
      - name: Enable Corepack (Yarn 4.8)
        run: corepack enable

      # ---- Rust 工具链（Tauri 需要 MSVC target）----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      # ---- 安装前端依赖（Yarn 4 PnP zero-install，--immutable 保证可复现）----
      - name: Install dependencies
        run: yarn install --immutable

      # ---- 确保 Tauri 签名密钥（createUpdaterArtifacts:true 必须签名）----
      # 若仓库未配置 TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD 这两个 secret，
      # 则临时生成一把密钥，保证构建能通过（注意：每次构建密钥不同，更新签名不可跨版本复用）。
      # 如需使用「应用内更新」功能，请在仓库 Settings -> Secrets 中配置固定密钥。
      - name: Ensure Tauri signing key
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_PRIVATE_KEY }}" ]; then
            echo "::notice::未检测到 TAURI_PRIVATE_KEY，临时生成签名密钥用于本次构建"
            yarn workspace @markflowy/desktop tauri signer generate -w "$RUNNER_TEMP/tauri.key"
            echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/tauri.key" >> "$GITHUB_ENV"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY<<EOF" >> "$GITHUB_ENV"
            echo "${{ secrets.TAURI_PRIVATE_KEY }}" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # ---- 构建 Windows 桌面端（产出 nsis 安装包 exe + msi）----
      - name: Build MarkFlowy desktop (EXE)
        run: yarn build:desktop --target x86_64-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- 列出产物，便于排错 ----
      - name: List build artifacts
        shell: bash
        run: |
          echo "::group::bundle contents"
          ls -R "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle" || true
          echo "::endgroup::"

      # ---- 上传产物为可下载 Artifact（每次构建都有，即使没打 tag）----
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MarkFlowy-Windows
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      # ---- 仅当推送 v* tag 时，自动创建 GitHub Release 并附上安装包 ----
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
